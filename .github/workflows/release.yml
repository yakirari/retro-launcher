name: Production release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag on main to build and prepare as a draft release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and verify signed APK
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag and notes
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the vX.Y.Z format." >&2
            exit 1
          fi

          git fetch origin --tags --force
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "The requested tag does not exist." >&2
            exit 1
          }
          git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}^{commit}" origin/main || {
            echo "The requested tag must point to a commit on main." >&2
            exit 1
          }

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub release already exists for this tag." >&2
            exit 1
          fi

          git checkout --detach "refs/tags/$RELEASE_TAG"
          python3 - "$RELEASE_TAG" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          gradle = Path("app/build.gradle.kts").read_text()
          match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          code_match = re.search(r"versionCode\s*=\s*(\d+)", gradle)
          if not match or not code_match or tag != f"v{match.group(1)}":
              raise SystemExit("Tag version does not match app/build.gradle.kts.")

          version = match.group(1)
          version_code = code_match.group(1)
          notes = Path("docs/releases") / f"{version}.md"
          if not notes.is_file():
              raise SystemExit(f"Release notes are missing: {notes}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"version_code={version_code}\n")
              output.write(f"notes={notes.as_posix()}\n")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = {
              "KEYSTORE_BASE64": os.environ.get("KEYSTORE_BASE64", ""),
              "STORE_PASSWORD": os.environ.get("STORE_PASSWORD", ""),
              "KEY_ALIAS": os.environ.get("KEY_ALIAS", ""),
              "KEY_PASSWORD": os.environ.get("KEY_PASSWORD", ""),
          }
          missing = [name for name, value in required.items() if not value]
          if missing:
              raise SystemExit("Missing production signing secrets: " + ", ".join(missing))

          keystore = base64.b64decode(required["KEYSTORE_BASE64"], validate=True)
          if not keystore:
              raise SystemExit("The production keystore secret decoded to an empty file.")

          def escape_property(value: str) -> str:
              escaped = []
              for character in value:
                  codepoint = ord(character)
                  if character == "\\":
                      escaped.append("\\\\")
                  elif character in " \t\r\n:=#!":
                      escaped.append("\\" + {"\t": "t", "\r": "r", "\n": "n"}.get(character, character))
                  elif codepoint < 0x20 or codepoint > 0x7E:
                      if codepoint <= 0xFFFF:
                          escaped.append(f"\\u{codepoint:04x}")
                      else:
                          codepoint -= 0x10000
                          escaped.append(f"\\u{0xD800 + (codepoint >> 10):04x}")
                          escaped.append(f"\\u{0xDC00 + (codepoint & 0x3FF):04x}")
                  else:
                      escaped.append(character)
              return "".join(escaped)

          keystore_path = Path("keystore/production-release.jks")
          keystore_path.parent.mkdir(mode=0o700, exist_ok=True)
          keystore_path.write_bytes(keystore)
          keystore_path.chmod(0o600)

          properties = {
              "storeFile": keystore_path.as_posix(),
              "storePassword": required["STORE_PASSWORD"],
              "keyAlias": required["KEY_ALIAS"],
              "keyPassword": required["KEY_PASSWORD"],
          }
          properties_file = Path("release-keystore.properties")
          properties_file.write_text(
              "".join(f"{key}={escape_property(value)}\n" for key, value in properties.items()),
              encoding="ISO-8859-1",
          )
          properties_file.chmod(0o600)
          PY
      - name: Run unit tests and build release APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain
      - name: Verify APK signature and metadata
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
          VERSION_NAME: ${{ steps.release.outputs.version }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"

          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apksigner-output.txt"
          cat "$RUNNER_TEMP/apksigner-output.txt"
          python3 - "$RUNNER_TEMP/apksigner-output.txt" "$apk" <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          signer_output = Path(sys.argv[1]).read_text()
          actual = re.search(
              r"Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F:]+)",
              signer_output,
          )
          expected = os.environ.get("EXPECTED_CERT_SHA256", "")
          if not actual or not expected:
              raise SystemExit("APK signer fingerprint or expected certificate fingerprint is missing.")
          normalize = lambda value: re.sub(r"[^0-9a-f]", "", value.lower())
          if normalize(actual.group(1)) != normalize(expected):
              raise SystemExit("APK certificate fingerprint does not match ANDROID_RELEASE_CERT_SHA256.")

          apk = sys.argv[2]
          analyzer = os.environ["ANDROID_HOME"] + "/cmdline-tools/latest/bin/apkanalyzer"
          metadata = {
              "application id": subprocess.check_output(
                  [analyzer, "manifest", "application-id", apk], text=True
              ).strip(),
              "version name": subprocess.check_output(
                  [analyzer, "manifest", "version-name", apk], text=True
              ).strip(),
              "version code": subprocess.check_output(
                  [analyzer, "manifest", "version-code", apk], text=True
              ).strip(),
          }
          if metadata["application id"] != "com.ariy.retrolauncher":
              raise SystemExit("Unexpected APK application ID: " + metadata["application id"])
          if metadata["version name"] != os.environ["VERSION_NAME"]:
              raise SystemExit("APK version name does not match the selected release tag.")
          if metadata["version code"] != os.environ["VERSION_CODE"]:
              raise SystemExit("APK version code does not match app/build.gradle.kts.")
          PY
      - name: Prepare release assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/RetroLauncher-${VERSION}.apk"
          (
            cd release-assets
            sha256sum "RetroLauncher-${VERSION}.apk" > SHA256SUMS
          )
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Retro Launcher ${{ steps.release.outputs.version }}
          draft: true
          body_path: ${{ steps.release.outputs.notes }}
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
