<svg xmlns="http://www.w3.org/2000/svg" width="320" height="208" viewBox="0 0 320 208">
	<title>Sega Saturn — orbital wordmark badge</title>
	<desc>Original orbital emblem and outlined path lettering, optimized for small monochrome badges.</desc>
	<g transform="rotate(-24 160 52)" fill="#FFFFFF">
